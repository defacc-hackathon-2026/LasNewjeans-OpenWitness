[project]
name = "openwitness"
version = "1.1.0"
description = "Open Witness: no repudio y atribución para agentes de IA (gateway entre el agente y su LLM)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pynacl>=1.6",
    "starlette>=1.0",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "anthropic>=2.8",
    "openai>=3.51",
    "mcp>=2,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
owit = "openwitness.entry:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openwitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 120
